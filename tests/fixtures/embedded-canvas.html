<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Embedded QR code</title>
    <style>
      body {
        align-items: center;
        background: #f8f9fa;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      canvas {
        background: #fff;
        border: 1px solid #dadce0;
        display: block;
        height: 160px;
        width: 260px;
      }
    </style>
  </head>
  <body>
    <canvas
      id="embedded-qr"
      width="260"
      height="160"
      data-qr-left="18"
      data-qr-top="18"
      data-qr-size="87"
    ></canvas>
    <script src="./qr-fixtures.js"></script>
    <script>
      const canvas = document.getElementById("embedded-qr");
      const context = canvas.getContext("2d", { alpha: false });
      context.fillStyle = "#fff";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#202124";
      context.font = "700 20px Arial";
      context.fillText("QR payment", 120, 48);
      context.font = "14px Arial";
      context.fillText("Scan this code", 120, 76);
      QrFixtures.drawQrCode(context, QrFixtures.matrices.google, {
        left: 18,
        top: 18,
        moduleSize: 3
      });
    </script>
  </body>
</html>
