<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Single QR code</title>
    <style>
      body {
        align-items: center;
        background: #f8f9fa;
        color: #202124;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        line-height: 34px;
        margin: 0;
      }

      .qr-frame {
        background: #fff;
        border: 1px solid #dadce0;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>google.com</h1>
      <div class="qr-frame" id="google-qr"></div>
    </main>
    <script src="./qr-fixtures.js"></script>
    <script>
      QrFixtures.renderQrCode(
        document.getElementById("google-qr"),
        QrFixtures.matrices.google,
        "QR code for google.com"
      );
    </script>
  </body>
</html>
