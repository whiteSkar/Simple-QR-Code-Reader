<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No QR codes</title>
    <style>
      body {
        align-items: center;
        background: #f8f9fa;
        color: #202124;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        align-items: center;
        border: 1px solid #dadce0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 40px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        line-height: 34px;
      }

      p {
        font-size: 16px;
        line-height: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No QR code here</h1>
      <p>This page intentionally has no QR-code image.</p>
    </main>
  </body>
</html>
