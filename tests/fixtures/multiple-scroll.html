<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scrollable multiple QR codes</title>
    <style>
      body {
        background: #f8f9fa;
        color: #202124;
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 1600px;
      }

      main {
        display: flex;
        gap: clamp(24px, 12vw, 160px);
        justify-content: center;
        margin: 120px auto 900px;
      }

      section {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        line-height: 30px;
        margin: 0;
      }

      .qr-frame {
        background: #fff;
        border: 1px solid #dadce0;
        padding: 24px;
      }

      .qr-frame svg {
        display: block;
        height: auto;
        width: min(348px, 26vw);
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>google.com</h1>
        <div class="qr-frame" id="google-qr"></div>
      </section>
      <section>
        <h1>example.com</h1>
        <div class="qr-frame" id="example-qr"></div>
      </section>
    </main>
    <script src="./qr-fixtures.js"></script>
    <script>
      QrFixtures.renderQrCode(
        document.getElementById("google-qr"),
        QrFixtures.matrices.google,
        "QR code for google.com"
      );
      QrFixtures.renderQrCode(
        document.getElementById("example-qr"),
        QrFixtures.matrices.example,
        "QR code for example.com"
      );
    </script>
  </body>
</html>
